[project]
name = "coord-convert-gui"
version = "1.0.0"
description = "Coordinate Converter GUI"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8.0",
    "pyproj>=3.7.0",
    "PyGeodesy>=22.6.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
]

[project.scripts]
coord-convert = "coord_convert_gui.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Only the application package is importable; data/, icons/ and resources/ are
# plain content directories at the repository root.
[tool.setuptools.packages.find]
include = ["coord_convert_gui*"]

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[tool.uv]
# Install the project itself (editable) so the `coord-convert` entry point works.
package = true
